<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#0a0f1e; --surface:#111b33; --surface2:#0e1730; --raise:#16223e;
  --line:#233150; --line2:#2e3f64;
  --ink:#eaf0fb; --ink2:#9fadca; --mut:#7d8cb0;
  --brand:#f6b73c; --brand-ink:#1c1405; --brand-soft:#3a2c0d;
  --red:#f26a5b; --red-bg:#331a1a; --red-line:#5a2b28;
  --amber:#e7ad3e; --amber-bg:#2b2410; --green:#4fcd8c; --green-bg:#123021; --green-line:#1f5138;
  --blue:#63a2ea; --blue-bg:#152741;
  --hero1:#16264c; --hero2:#0f1c3a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.28);
  --r:16px; --nav-h:62px;
}
:root[data-theme=light]{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f5f7fc; --raise:#ffffff;
  --line:#e3e8f1; --line2:#d7deec;
  --ink:#141d33; --ink2:#4c5872; --mut:#5f6982;
  --brand:#b9770f; --brand-ink:#fff; --brand-soft:#fbeecd;
  --red:#c53c2c; --red-bg:#fbece9; --red-line:#f2ccc5;
  --amber:#9a6a15; --amber-bg:#f9f0dc; --green:#1c7d4e; --green-bg:#e7f5ee; --green-line:#c6e6d5;
  --blue:#2860ab; --blue-bg:#eaf1fb;
  --hero1:#14213d; --hero2:#1d2d52;
  --shadow:0 1px 3px rgba(20,33,61,.08), 0 8px 26px rgba(20,33,61,.06);
}
@media (prefers-color-scheme: light){ :root:not([data-theme=dark]):not([data-theme=light]){
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f5f7fc; --raise:#ffffff;
  --line:#e3e8f1; --line2:#d7deec; --ink:#141d33; --ink2:#4c5872; --mut:#5f6982;
  --brand:#b9770f; --brand-ink:#fff; --brand-soft:#fbeecd;
  --red:#c53c2c; --red-bg:#fbece9; --red-line:#f2ccc5; --amber:#9a6a15; --amber-bg:#f9f0dc;
  --green:#1c7d4e; --green-bg:#e7f5ee; --green-line:#c6e6d5; --blue:#2860ab; --blue-bg:#eaf1fb;
  --hero1:#14213d; --hero2:#1d2d52; --shadow:0 1px 3px rgba(20,33,61,.08), 0 8px 26px rgba(20,33,61,.06);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Heebo",-apple-system,"Segoe UI",system-ui,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));overflow-x:hidden}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 9px) 15px 9px;display:flex;align-items:center;gap:11px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:18px;font-weight:800;letter-spacing:.2px}
.brand b i{font-style:normal;color:var(--brand)}
.brand small{font-size:11px;color:var(--mut);font-weight:500}
.hsp{flex:1}
.iconbtn{min-width:44px;min-height:44px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink2);font-size:17px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{transform:scale(.94)}
.demo-dot{font-size:10.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);padding:3px 9px;border-radius:20px}

main{max-width:660px;margin:0 auto;padding:13px 13px 8px}
.page{display:none}.page.on{display:block}

.sec{display:flex;align-items:baseline;gap:8px;margin:20px 4px 9px}
.sec:first-child{margin-top:6px}
.sec h2{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);margin:0}
.sec .n{font-size:11.5px;color:var(--mut);font-weight:600}
.sec .act{margin-inline-start:auto;font-size:12.5px;color:var(--brand);font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
.divider{margin:26px 4px 4px;padding-top:14px;border-top:1px dashed var(--line2);text-align:center}
.divider span{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:9px}
.pad{padding:13px 15px}

.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));border:1px solid var(--line2);
  border-radius:18px;box-shadow:var(--shadow);padding:16px 17px;color:#eef3fc;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-block:-40% auto;inset-inline-end:-30%;width:60%;height:180%;
  background:radial-gradient(closest-side,rgba(246,183,60,.16),transparent);pointer-events:none}
.hero .lbl{display:flex;align-items:center;gap:7px;color:#f6b73c;font-size:11.5px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
.hero .txt{font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.hero .sub{font-size:12.5px;opacity:.78;margin-top:6px}
.hero .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:10px}
.hero .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.hero .override{background:rgba(242,106,91,.16);border:1px solid rgba(242,106,91,.4);border-radius:11px;
  padding:8px 11px;margin-bottom:11px;font-size:12.5px;color:#ffd7d0;cursor:pointer;display:flex;gap:7px;align-items:center}

.btn{border:0;border-radius:11px;padding:11px 15px;min-height:44px;font-size:13.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.amber{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn.line{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--green);color:#04140b}
.btn.red{background:transparent;color:var(--red);border:1px solid var(--red-line)}
.btn.sm{padding:9px 13px;min-height:40px;font-size:13px;border-radius:10px}
.btn.block{width:100%}

.row{display:flex;gap:11px;padding:12px 15px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start;min-height:48px}
.card .row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;line-height:1.35}
.row .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lead{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;margin-top:1px}
.stripe{position:relative}
.stripe::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px}
.stripe.s-red::before{background:var(--red)}.stripe.s-amber::before{background:var(--amber)}
.stripe.s-green::before{background:var(--green)}.stripe.s-blue::before{background:var(--blue)}

.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;letter-spacing:.02em}
.chip.red{background:var(--red-bg);color:var(--red)}.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.green{background:var(--green-bg);color:var(--green)}.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.mut{background:var(--surface2);color:var(--mut);border:1px solid var(--line)}
.dim{color:var(--mut)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--mut);flex:none}

.mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mini button{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);
  border-radius:9px;padding:9px 13px;min-height:40px;font-size:12.5px;font-weight:600;cursor:pointer}
.mini button:active{transform:scale(.95)}
.mini button.go{color:var(--green);border-color:var(--green-line)}
.mini button.warn{color:var(--red);border-color:var(--red-line)}

.arena{padding:14px 15px;cursor:pointer}
.arena .top{display:flex;align-items:center;gap:8px}
.arena .nm{font-size:15.5px;font-weight:700}
.arena .goal{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.45;border-inline-start:2px solid var(--brand);padding-inline-start:9px}
.arena .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;font-size:11.5px;color:var(--mut);align-items:center}

.empty{color:var(--mut);font-size:13px;padding:14px 15px;text-align:center}
.mini-empty{color:var(--mut);font-size:12.5px;padding:10px 15px}
.moreline{color:var(--brand);font-size:12.5px;font-weight:600;padding:11px 15px;border-top:1px solid var(--line);cursor:pointer;text-align:center}

nav{position:fixed;bottom:0;inset-inline:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:40}
nav button{flex:1;background:none;border:0;color:var(--mut);cursor:pointer;font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:8px;position:relative}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--brand)}
nav .bdg{position:absolute;top:5px;margin-inline-start:22px;background:var(--red);color:#fff;font-size:9px;
  font-weight:800;border-radius:20px;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center}

.fab{position:fixed;inset-inline-end:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  width:56px;height:56px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);
  font-size:27px;box-shadow:0 8px 22px rgba(246,183,60,.34);cursor:pointer;z-index:41;display:grid;place-items:center}
.fab:active{transform:scale(.93)}

.ov{position:fixed;inset:0;background:rgba(4,7,15,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;background:var(--surface);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line2);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  max-height:90vh;overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 6px}
.sheet h3{font-size:16.5px;font-weight:800;margin:6px 2px 4px}
.sheet .sub2{font-size:12.5px;color:var(--ink2);margin:0 2px 12px;line-height:1.5}
.seg{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--ink2);font-weight:700;font-size:13px;padding:10px;min-height:44px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
textarea,input,select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 13px;font-size:15px;font-family:inherit;resize:none;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--brand)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin:0 2px 5px;letter-spacing:.04em}
.capbox{position:relative}
.mic{position:absolute;inset-block-start:8px;inset-inline-end:8px;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:17px;cursor:pointer;display:grid;place-items:center}
.mic.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.chips-in{display:flex;gap:6px;flex-wrap:wrap}
.chips-in .c{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:20px;padding:9px 14px;min-height:40px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center}
.chips-in .c.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

.blk{margin-top:15px}
.blk h4{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:0 2px 7px}
.kv{font-size:13.5px;line-height:1.5;padding:3px 2px}
.li{font-size:13.5px;padding:8px 2px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.li:first-child{border-top:0}

.toast{position:fixed;inset-inline:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  background:var(--raise);border:1px solid var(--line2);color:var(--ink);border-radius:13px;padding:13px 15px;
  z-index:60;box-shadow:var(--shadow);transform:translateY(160%);transition:transform .24s;font-size:14px;
  display:flex;align-items:center;gap:10px;max-width:630px;margin:0 auto}
.toast.on{transform:none}
.toast .u{margin-inline-start:auto;color:var(--brand);font-weight:800;cursor:pointer;font-size:13px;min-height:32px;display:flex;align-items:center}

.ask-wrap{display:flex;flex-direction:column;min-height:calc(100vh - var(--nav-h) - 130px)}
.ask-feed{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.q-bub{align-self:flex-start;max-width:85%;background:var(--brand);color:var(--brand-ink);border-radius:15px 4px 15px 15px;padding:10px 13px;font-size:14px;font-weight:600}
.a-bub{align-self:flex-end;max-width:92%;background:var(--surface);border:1px solid var(--line);border-radius:4px 15px 15px 15px;padding:11px 14px;font-size:14px;line-height:1.55}
.a-bub.load{color:var(--mut)}
.ak-sug{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 12px}
.ak-sug .c{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:20px;padding:9px 13px;min-height:40px;font-size:12.5px;cursor:pointer;display:flex;align-items:center}
.ask-bar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));display:flex;gap:8px;padding:9px 0;background:linear-gradient(0deg,var(--bg) 72%,transparent)}
.ask-bar input{flex:1}
.ask-bar button{flex:none;width:48px;min-height:48px;border-radius:12px;border:0;background:var(--brand);color:var(--brand-ink);font-size:18px;cursor:pointer}
.md b{font-weight:800}.md .h{font-weight:800;margin-top:8px}.md ul{margin:6px 0;padding-inline-start:20px}.md li{margin:2px 0}
.md code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}

.gate{max-width:400px;margin:11vh auto;padding:26px 22px;text-align:center}
.gate .logo{font-size:42px;margin-bottom:4px}
.gate h1{font-size:25px;font-weight:800;margin:0 0 4px}.gate h1 i{font-style:normal;color:var(--brand)}
.gate p{color:var(--ink2);font-size:14px;margin:0 0 18px;line-height:1.5}
.gate input{text-align:center;margin-bottom:11px}
.gate .err{color:var(--red);font-size:12.5px;margin:0 0 10px;min-height:16px;font-weight:600}
.foot{text-align:center;color:var(--mut);font-size:11px;padding:22px 0 6px}
.foot b{color:var(--ink2);font-weight:600}
</style>
</head>

function ts(iso){ if(!iso)return NaN; const t=new Date(iso).getTime(); return isNaN(t)?NaN:t; }
function daysAgo(iso){ const t=ts(iso); return isNaN(t)?null:Math.floor((Date.now()-t)/864e5); }
function dueIn(d){ if(!d)return null; const t=new Date(String(d).slice(0,10)+"T00:00:00").getTime(); return isNaN(t)?null:Math.round((t-Date.now())/864e5); }
function fmtDay(d){ if(!d)return ""; const p=String(d).slice(0,10).split("-"); return p[2]+"."+p[1]; }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); localStorage.setItem("nx_theme",nx); setThemeColor(); }

/* ---------- data ---------- */
async function load(force){
  if(KEY){
    try{
      const r=await fetch(API,{headers:{"x-nexus-key":KEY},cache:"no-store"});
      if(r.status===403){ localStorage.removeItem("nx_hqkey"); KEY=""; }
      else if(r.ok){ D=await r.json(); LIVE=true; DEMO=false; try{localStorage.setItem("nx_cache",JSON.stringify(D));}catch(e){} }
    }catch(e){}
    if(!D && !force){ const c=localStorage.getItem("nx_cache"); if(c){ try{ D=JSON.parse(c); DEMO=!LIVE; }catch(e){} } }
    if(!D && SNAP){ D=SNAP; DEMO=true; }   /* had a key but fully offline → demo rather than blank */
  }
  if(!D){ gate(); return; }                /* no key → key gate (which also offers the demo button) */
  if(SNAP && !LIVE) DEMO=true;
  index(); render();
}
function index(){ AR={};PE={};OB={};
  (D.arenas||[]).forEach(a=>AR[a.id]=a);
  (D.people||[]).forEach(p=>PE[p.id]=p);
  (D.objectives||[]).forEach(o=>{(OB[o.arena_id]=OB[o.arena_id]||[]).push(o);});
}
const arenaName=id=>id&&AR[id]?AR[id].name:"";
const personName=id=>id&&PE[id]?PE[id].name:"";

/* HONEST arena activity: last corroborated touch + whether a real expectation broke.
   Never conflates "never logged" with "dying". Red only when an expectation is broken. */
function arenaActivity(id){
  let last=null;
  (D.events||[]).forEach(e=>{ if(e.arena_id===id){ const t=ts(e.happened_at); if(!isNaN(t)&&(last==null||t>last))last=t; } });
  const today=todayISO();
  let broken=null;
  (D.commitments||[]).forEach(c=>{ if(c.arena_id===id&&c.direction==="to_itay"&&c.due&&c.due<today) broken=broken||("התחייבות באיחור: "+c.what); });
  (OB[id]||[]).forEach(o=>{ if(o.next_step_due&&o.next_step_due<today) broken=broken||("צעד באיחור: "+(o.next_step||o.title)); });
  const days=last==null?null:Math.floor((Date.now()-last)/864e5);
  return {last,days,broken};
}

async function api(url,payload){
  if(!LIVE) return {ok:true,demo:true};
  const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json","x-nexus-key":KEY},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
let toastT;
function toast(msg,undo){ const el=$("#toast"); if(!el)return;
  el.querySelector(".m").textContent=msg;
  const u=el.querySelector(".u"); u.style.display=undo?"":"none";
  if(undo)u.onclick=()=>{ undo(); el.classList.remove("on"); };
  el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),undo?5000:2600);
}
function afterAct(){ if(LIVE) load(true); else render(); }

  if(!el.querySelector("header")) shell();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  const host=$("#main");
  if(TAB==="today")host.innerHTML=vToday();
  else if(TAB==="arenas")host.innerHTML=vArenas();
  else if(TAB==="decisions")host.innerHTML=vDecisions();
  else if(TAB==="ask"){ host.innerHTML=vAsk(); renderAsk(); }
  host.scrollTop=0; updateBadges();
  const dd=$("#demoDot"); if(dd)dd.style.display=DEMO?"":"none";
}

/* ================= ARENAS ================= */
function vArenas(){
  const arenas=(D.arenas||[]), open=(D.tasks||[]).filter(t=>t.status==="open"||t.status==="waiting");
  const order={active:0,pipeline:1,on_hold:2,archived:3};
  const active=arenas.filter(a=>a.status==="active"||a.status==="pipeline"||a.status==="on_hold").sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||(a.name||"").localeCompare(b.name||"","he"));
  const inactive=arenas.filter(a=>a.status==="archived");
  let h=secH("🏗️ זירות","כל זירה מול מטרת-העל שלה",arenas.length);
  h+=active.map(a=>arenaCard(a,open)).join("");
  if(inactive.length) h+=`<div class="sec" style="margin-top:16px"><span class="act" onclick="toggleArchived(this)">הצג לא-פעילות (${inactive.length}) ›</span></div><div id="archived" style="display:none">${inactive.map(a=>arenaCard(a,open)).join("")}</div>`;
  return h;
}
function toggleArchived(el){ const d=$("#archived"); if(d){ const on=d.style.display==="none"; d.style.display=on?"block":"none"; el.textContent=(on?"הסתר לא-פעילות ‹":"הצג לא-פעילות ("+d.children.length+") ›"); } }
function arenaCard(a,open){
  const cnt=open.filter(t=>t.arena_id===a.id).length;
  const act=arenaActivity(a.id); const obj=(OB[a.id]||[])[0]; const goal=cleanGoal(a.goal);
  const silent=a.status==="active"&&cnt>0&&(act.broken||(act.days!=null&&act.days>=6));
  const stc={active:"green",pipeline:"blue",archived:"mut",on_hold:"amber"}[a.status]||"mut";
  const stt={active:"פעילה",pipeline:"pipeline",archived:"ארכיון",on_hold:"בהמתנה"}[a.status]||a.status;
  const recency=act.days!=null?(act.days<=0?"היום":act.days===1?"אתמול":"לפני "+act.days+" ימים"):"ללא תנועה מתועדת";
  const recRed=act.days!=null&&act.days>=6;
  return `<div class="card arena" onclick="openArena('${a.id}')" style="margin-top:9px">
    <div class="top"><div class="nm">${esc(nm0(a.name))}</div><span style="flex:1"></span><span class="chip ${stc}">${stt}</span>${silent?`<span class="chip ${act.broken?"red":"amber"}">${act.broken?"דורש טיפול":"שקט"}</span>`:""}</div>
    ${goal?`<div class="goal">🎯 ${esc(goal.length>150?goal.slice(0,150)+"…":goal)}</div>`:""}
    <div class="meta"><span class="chip mut">${cnt} משימות</span>${obj&&obj.next_step?`<span class="dim">→ ${esc(obj.next_step.slice(0,52))}</span><span class="dot"></span>`:""}<span class="dim" style="${recRed?"color:var(--red)":""}">עודכן ${recency}</span></div></div>`;
}

  if(decs.length)h+=`<div class="blk"><h4>החלטות ממתינות · ${decs.length}</h4>${decs.map(d=>`<div class="li">⚖ <span>${esc(d.title)}</span></div>`).join("")}</div>`;
  h+=`<div class="blk"><h4>↪ חייבים לך · ${toMe.length}</h4>${list(toMe,c=>`<div class="li"><span>${esc(c.what)}${c.person_id?` <span class="dim">— ${esc(personName(c.person_id))}</span>`:""}${c.due?` <span class="dim">(${fmtDay(c.due)})</span>`:""}</span></div>`,"—")}</div>`;

async function draftArena(id,btn){

  const groups={}; pend.forEach(d=>{ const k=d.arena_id||"—"; (groups[k]=groups[k]||[]).push(d); });

function openDecision(id){

async function decide(id,verdict,fromSheet){
  const note=fromSheet?(($("#decNote")||{}).value||"").trim():"";

  if(fromSheet)closeSheet();
  render(); toast(verdict==="decided"?"הוכרע ✓":"ירד מהפרק");
  try{ await api(ACT,{action:"decision_decide",id,verdict,note}); }catch(e){ toast("שמירה נכשלה — ינוסה ברענון"); }

}

/* ================= ASK ================= */
let askHist=[];
const AK_SUG=["מה הכי דחוף להכרעה היום?","אילו זירות שקטות מדי?","מה מצב האנרגיה בחמד?","מי מהצוות תקוע הכי הרבה?","סכם לי את השדרה"];
function vAsk(){ return `<div class="sec"><h2>✦ שאל את המוח</h2><span class="n dim">· ${LIVE?"מחובר":"הדגמה"}</span></div>
  <div class="ask-wrap"><div class="ask-feed" id="askFeed"></div><div class="ask-bar"><input id="askIn" placeholder="שאל על עסקה, אדם, החלטה…" onkeydown="if(event.key==='Enter')askSend()"><button onclick="askSend()" aria-label="שלח">↑</button></div></div>`; }
function renderAsk(){ const feed=$("#askFeed"); if(!feed)return;
  if(!askHist.length){ feed.innerHTML=`<div class="a-bub">שלום איתי. אני ראש המטה של נקסוס — שאל אותי על העסקאות, האנשים, ההחלטות והמצב.${LIVE?"":"<br><br><b>מצב הדגמה:</b> המוח מגיב רק כשמחוברים עם מפתח."}</div><div class="ak-sug">${AK_SUG.map(s=>`<span class="c" onclick="askChip(this)">${esc(s)}</span>`).join("")}</div>`; return; }
  feed.innerHTML=askHist.map(m=>m.q!=null?`<div class="q-bub">${esc(m.q)}</div>`:`<div class="a-bub ${m.load?"load":""} md">${m.load?"חושב… (עד ~30 שנ׳)":fmtMd(m.a)}</div>`).join("");
  feed.scrollTop=feed.scrollHeight;
}
function askChip(el){ $("#askIn").value=el.textContent; askSend(); }
async function askSend(){ const inp=$("#askIn"); const q=(inp.value||"").trim(); if(!q)return; inp.value="";
  askHist.push({q}); askHist.push({load:true}); renderAsk();
  if(!LIVE){ askHist[askHist.length-1]={a:"במצב הדגמה אין גישה למוח החי. במכשיר שלך, עם המפתח — כאן תקבל תשובה מלאה עם נתוני אמת, כולל שרשור שאלות."}; renderAsk(); return; }
  const history=[]; for(let i=0;i<askHist.length-1;i++){ const m=askHist[i]; if(m.q!=null)history.push({q:m.q}); else if(m.a!=null&&!m.load&&history.length)history[history.length-1].a=m.a; }
  try{ const r=await fetch(ASK,{method:"POST",headers:{"content-type":"application/json","x-nexus-key":KEY},body:JSON.stringify({q,history:history.slice(-6)})});
    const j=await r.json(); askHist[askHist.length-1]={a:j.reply||"לא הצלחתי לענות על זה כרגע."};
  }catch(e){ askHist[askHist.length-1]={a:"שגיאה בגישה למוח. נסה שוב עוד רגע."}; }
  renderAsk();
}
function fmtMd(t){ t=esc(t); const lines=t.split("\n"); let out="",inUl=false; const flush=()=>{if(inUl){out+="</ul>";inUl=false;}};
  for(let ln of lines){ if(/^\s*[-•]\s+/.test(ln)){ if(!inUl){out+="<ul>";inUl=true;} out+="<li>"+ln.replace(/^\s*[-•]\s+/,"")+"</li>"; continue; } flush();
    if(/^#{1,4}\s/.test(ln))out+='<div class="h">'+ln.replace(/^#+\s/,"")+"</div>"; else if(ln.trim()==="")out+="<br>"; else out+="<div>"+ln+"</div>"; }
  flush(); return out.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
}

  let h=`<div class="grab"></div><h3>${esc(t.title)}</h3><div class="m" style="margin:0 2px 4px;display:flex;gap:6px;flex-wrap:wrap"><span class="chip ${URGC[t.urgency]||"mut"}">${URG[t.urgency]||""}</span>${t.arena_id?`<span class="chip mut">${esc(nm0(arenaName(t.arena_id)))}</span>`:""}${owner?`<span class="chip mut">${esc(owner)}</span>`:""}${t.due_date?`<span class="chip mut">${fmtDay(t.due_date)}</span>`:""}</div>`;
  if(t.notes)h+=`<div class="card pad" style="background:var(--surface2);white-space:pre-wrap;font-size:13.5px;margin-top:10px">${esc(t.notes)}</div>`;
  h+=`<div style="display:flex;gap:8px;margin-top:16px"><button class="btn green block" onclick="taskDone('${id}')">✅ בוצע</button><button class="btn amber block" onclick="focusFromTask('${id}')">⭐ הדבר האחד</button></div><div class="blk"><h4>דחיפות</h4><div class="chips-in">${["today","week","month","whenever"].map(u=>`<span class="c ${t.urgency===u?"on":""}" onclick="setUrg('${id}','${u}',this)">${URG[u]}</span>`).join("")}</div></div>`;
  openSheet(h);
}
async function taskDone(id){ const t=(D.tasks||[]).find(x=>x.id===id); if(t)t.status="done"; closeSheet(); render();
  toast("בוצע ✓",()=>{ const tt=(D.tasks||[]).find(x=>x.id===id); if(tt)tt.status="open"; render(); if(LIVE)api(API,{action:"task_reopen",id}).catch(()=>{}); });
  try{ await api(API,{action:"task_done",id}); }catch(e){}
}
async function setUrg(id,u,el){ const t=(D.tasks||[]).find(x=>x.id===id); if(t)t.urgency=u; el.parentNode.querySelectorAll(".c").forEach(c=>c.classList.remove("on")); el.classList.add("on"); try{await api(API,{action:"task_urgency",id,urgency:u});}catch(e){} }

function triage(id){ const c=(D.captures||[]).find(x=>x.id===id); if(!c)return;
  const arenas=(D.arenas||[]).filter(a=>a.status!=="archived");
  let h=`<div class="grab"></div><h3>נקז קליטה</h3><div class="card pad" style="background:var(--surface2);font-size:14px;margin-bottom:12px">${esc(c.text||"")}</div>
    <div class="field"><label>זירה (לא חובה)</label><select id="trArena"><option value="">— ללא —</option>${arenas.map(a=>`<option value="${a.id}">${esc(nm0(a.name))}</option>`).join("")}</select></div>
    <div style="display:flex;gap:8px"><button class="btn green block" onclick="triageDo('${id}','task')">→ משימה</button><button class="btn line block" onclick="triageDo('${id}','idea')">→ רעיון</button></div>`;
  openSheet(h);
}
async function triageDo(id,kind){ const c=(D.captures||[]).find(x=>x.id===id); if(!c)return; const arena_id=($("#trArena")||{}).value||null;
  D.captures=(D.captures||[]).filter(x=>x.id!==id);
  if(kind==="task")(D.tasks=D.tasks||[]).unshift({id:"tmp"+Date.now(),title:c.text,arena_id,urgency:"week",status:"open",created_at:todayISO()});
  closeSheet(); render(); toast(kind==="task"?"הפך למשימה ☑️":"נשמר כרעיון 💡");
  try{ if(kind==="task")await api(API,{action:"task_create",title:c.text,arena_id,urgency:"week"}); else await api(API,{action:"idea_add",title:c.text,arena_id}); }catch(e){}
  afterAct();
}

function captureSheet(){ capMode="capture";
  const arenas=(D.arenas||[]).filter(a=>a.status!=="archived");
  const canVoice=("webkitSpeechRecognition" in window)||("SpeechRecognition" in window);
  let h=`<div class="grab"></div><h3>לכידה מהירה</h3>
    <div class="seg" id="capSeg"><button data-m="capture" class="on">📥 קליטה</button><button data-m="task">☑️ משימה</button><button data-m="idea">💡 רעיון</button></div>
    <div class="field capbox"><textarea id="capTxt" rows="3" placeholder="מה על הראש?"></textarea>${canVoice?`<button class="mic" id="micBtn" aria-label="הקלטה">🎙</button>`:""}</div>
    <div id="capExtra"></div><button class="btn amber block" onclick="capSubmit()">שמור</button>`;
  openSheet(h);
  const seg=$("#capSeg"), extra=$("#capExtra");
  function drawExtra(){ if(capMode==="capture"){extra.innerHTML="";return;}
    extra.innerHTML=`<div class="field"><label>זירה</label><select id="capArena"><option value="">— ללא —</option>${arenas.map(a=>`<option value="${a.id}">${esc(nm0(a.name))}</option>`).join("")}</select></div>${capMode==="task"?`<div class="field"><label>דחיפות</label><div class="chips-in">${["today","week","month","whenever"].map((u,i)=>`<span class="c ${i===1?"on":""}" data-u="${u}" onclick="pickUrg(this)">${URG[u]}</span>`).join("")}</div></div>`:""}`; capUrg="week"; }
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{ capMode=b.dataset.m; seg.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); drawExtra(); });
  if(canVoice)$("#micBtn").onclick=voiceToggle;
}
function pickUrg(el){ el.parentNode.querySelectorAll(".c").forEach(c=>c.classList.remove("on")); el.classList.add("on"); capUrg=el.dataset.u; }
function voiceToggle(){ const btn=$("#micBtn"), ta=$("#capTxt"); const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(rec){ rec.stop(); rec=null; btn.classList.remove("rec"); return; }
  try{ rec=new SR(); rec.lang="he-IL"; rec.interimResults=true; rec.continuous=true; const base=ta.value?ta.value+" ":"";
    rec.onresult=e=>{ let s=""; for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript; ta.value=base+s; };
    rec.onend=()=>{ btn.classList.remove("rec"); rec=null; }; rec.onerror=()=>{ btn.classList.remove("rec"); rec=null; };
    rec.start(); btn.classList.add("rec");
  }catch(e){ toast("הקלטה לא נתמכת בדפדפן"); rec=null; }
}
async function capSubmit(){ const txt=($("#capTxt").value||"").trim(); if(!txt)return; if(rec){try{rec.stop();}catch(e){}rec=null;}
  const arenaEl=$("#capArena"), arena_id=arenaEl?arenaEl.value||null:null, mode=capMode;
  closeSheet();
  if(mode==="capture")(D.captures=D.captures||[]).unshift({id:"tmp"+Date.now(),text:txt,created_at:todayISO()});
  else if(mode==="task")(D.tasks=D.tasks||[]).unshift({id:"tmp"+Date.now(),title:txt,arena_id,urgency:capUrg,status:"open",created_at:todayISO()});
  else (D.ideas=D.ideas||[]).unshift({id:"tmp"+Date.now(),title:txt,arena_id});
  render();
  try{ if(mode==="capture"){await api(API,{action:"capture_add",text:txt}); toast("נקלט 📥");}
    else if(mode==="task"){await api(API,{action:"task_create",title:txt,arena_id,urgency:capUrg}); toast("משימה נוצרה ☑️");}
    else{await api(API,{action:"idea_add",title:txt,arena_id}); toast("רעיון נשמר 💡");}
  }catch(e){ toast("שמירה נכשלה"); }
  afterAct();
}

/* ================= more / people ================= */
function moreSheet(){ const people=(D.people||[]);
  const morchim=people.filter(p=>/מורח|מתמהמה|לא אמין|איטי/.test((p.reliability_notes||"")+(p.work_notes||"")));
  let h=`<div class="grab"></div><h3>עוד</h3><div class="mini" style="margin:2px 0 6px"><button onclick="toggleTheme()">🌓 מצב תצוגה</button><button onclick="load(true);closeSheet();toast('מרענן…')">🔄 רענון</button>${LIVE?`<button class="warn" onclick="logout()">התנתקות</button>`:""}</div>`;
  h+=`<div class="blk"><h4>👥 אנשים · ${people.length}</h4><div class="sub2" style="margin:0 2px 8px">כיול פולו-אפ: "מורח" = נדנוד יזום; אמין = מרחב.</div>`;
  if(morchim.length)h+=`<div style="font-size:12px;color:var(--red);font-weight:700;margin:0 2px 6px">⚠ דורשים נדנוד יזום:</div>`+morchim.slice(0,6).map(p=>`<div class="li"><span>${esc(p.name)}${p.organization?` <span class="dim">· ${esc(p.organization)}</span>`:""}</span></div>`).join("");
  h+=`<div style="margin-top:8px"><input id="peopleSearch" placeholder="חפש אדם…" oninput="filterPeople(this.value)"></div><div id="peopleList" style="margin-top:8px">`+peopleRows(people.slice(0,12))+`</div></div>`;
  h+=`<div class="blk"><h4>🧠 מה המערכת למדה עליי</h4><div class="sub2" style="margin:0 2px">${(D.lessons||[]).length||46} לקחים מכוונים את המערכת:</div>${(D.lessons||[]).slice(0,5).map(l=>`<div class="li">• ${esc((l.lesson||"").slice(0,150))}</div>`).join("")||`<div class="mini-empty">הלקחים חיים בשרת</div>`}</div>`;
  openSheet(h);
}
function peopleRows(arr){ return arr.map(p=>{ const rel=/מורח|לא אמין|מתמהמה/.test((p.reliability_notes||"")+(p.work_notes||""))?"red":/אמין|מהיר|יסודי/.test((p.reliability_notes||""))?"green":"mut";
  return `<div class="li"><div style="flex:1"><b>${esc(p.name)}</b>${p.role||p.organization?`<br><span class="dim" style="font-size:12px">${esc([p.role,p.organization].filter(Boolean).join(" · "))}</span>`:""}</div>${p.phone?`<a href="tel:${esc(p.phone)}" class="chip mut" style="text-decoration:none">☎</a>`:""}${p.reliability_notes?`<span class="chip ${rel}">${rel==="red"?"מורח":rel==="green"?"אמין":"—"}</span>`:""}</div>`; }).join(""); }
function filterPeople(q){ q=(q||"").trim(); const arr=(D.people||[]).filter(p=>!q||((p.name||"")+(p.role||"")+(p.organization||"")).includes(q)).slice(0,20); $("#peopleList").innerHTML=peopleRows(arr); }

/* ================= sheets / nav ================= */
let sheetOpen=false;
function openSheet(html){ $("#sheet").innerHTML=html; $("#sheet").classList.add("on"); $("#ov").classList.add("on"); if(!sheetOpen){ sheetOpen=true; history.pushState({sheet:1},""); } }
function closeSheet(){ if(!sheetOpen)return; sheetOpen=false; $("#sheet").classList.remove("on"); $("#ov").classList.remove("on"); if(history.state&&history.state.sheet)history.back(); }
window.addEventListener("popstate",()=>{ if(sheetOpen){ sheetOpen=false; $("#sheet").classList.remove("on"); $("#ov").classList.remove("on"); } });
function go(t){ TAB=t; closeSheet(); render(); }
function logout(){ localStorage.removeItem("nx_hqkey"); localStorage.removeItem("nx_cache"); location.reload(); }

/* ================= gate ================= */
function gate(err){ app().innerHTML=`<div class="gate"><div class="logo">◎</div><h1>Nexus<i> HQ</i></h1><p>חדר המצב האישי שלך. הזן מפתח גישה כדי להתחבר לנתונים החיים.</p><div class="err">${err?esc(err):""}</div><input id="gateKey" type="password" placeholder="מפתח גישה" onkeydown="if(event.key==='Enter')gateGo()"><button class="btn amber block" onclick="gateGo()">התחבר</button>${SNAP?`<button class="btn line block" style="margin-top:9px" onclick="D=SNAP;DEMO=true;index();render()">צפה בהדגמה (נתונים סינתטיים)</button>`:""}<div class="foot">נטול-סודות · המפתח נשמר רק במכשיר שלך</div></div>`;
  const gk=$("#gateKey"); if(gk)gk.focus();
}
async function gateGo(){ const v=($("#gateKey").value||"").trim(); if(!v)return;
  try{ const r=await fetch(API,{headers:{"x-nexus-key":v},cache:"no-store"});
    if(r.status===403){ gate("מפתח שגוי — נסה שוב"); return; }
    if(r.ok){ KEY=v; localStorage.setItem("nx_hqkey",v); D=await r.json(); LIVE=true; DEMO=false; try{localStorage.setItem("nx_cache",JSON.stringify(D));}catch(e){} index(); render(); return; }
    gate("שגיאת חיבור ("+r.status+")");
  }catch(e){ gate("אין חיבור לרשת — נסה שוב"); }
}

/* ================= boot ================= */
load();
setInterval(()=>{ if(LIVE&&document.visibilityState==="visible")load(true); },300000);
document.addEventListener("visibilitychange",()=>{ if(LIVE&&document.visibilityState==="visible")load(true); });
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
